# 道生一 macOS 打包流水线
# - 手动触发：Actions → Build macOS → Run workflow
# - 推送 v* 标签：自动打包并发布 GitHub Release（一个 universal dmg，兼容 Intel + Apple Silicon）
#
# 注意：
# - GitHub 已退役 macOS 13（Intel）runner，当前只有 Apple Silicon（macos-14/15）→
#   用 `tauri build --target universal-apple-darwin` 在 arm64 runner 上交叉编译
#   x86_64 + aarch64 两个 target 并 lipo 合并为通用二进制（单个 dmg 两种芯片都能装）
# - bundle.resources 里的 ocr_tool 是编译产物（.gitignore 忽略），需编译为 universal：
#   swiftc 分别编 arm64/x86_64 再 lipo 合并（Vision/ImageIO 为系统框架自动链接）
# - 产物为 ad-hoc 签名（未配置 Apple 开发者证书），首次打开若被 Gatekeeper 拦截，右键「打开」放行

name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    name: Bundle macOS (universal x86_64 + aarch64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 与 ci.yml 同源：版本只在 .nvmrc 里写一次
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Rust
        # 与 rust-toolchain.toml / ci.yml 同步（升级时三处一起改）
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      # ocr_tool 是编译产物且被 gitignore，需先编译为 universal（两架构 + lipo 合并）
      - name: Compile OCR tool (universal)
        working-directory: src-tauri
        run: |
          swiftc -O ocr_tool.swift -o ocr_tool-arm64 -framework PDFKit -framework AppKit -target arm64-apple-macos13.0
          swiftc -O ocr_tool.swift -o ocr_tool-x64 -framework PDFKit -framework AppKit -target x86_64-apple-macos13.0
          lipo -create -output ocr_tool ocr_tool-arm64 ocr_tool-x64
          file ocr_tool

      # beforeBuildCommand 会先执行 npm run build（vue-tsc + vite build）
      # universal-apple-darwin：交叉编译两架构并 lipo 合并为通用 app → 单个 dmg 兼容两种芯片
      - name: Build & bundle (Tauri, universal)
        run: npm run tauri build -- --target universal-apple-darwin

      # ⚠️ 产物名里的非 ASCII 字符会在上传/发布链路上被吃掉：Tauri 打出的是
      # `道生一_1.0.0-alpha.2_universal.dmg`，但 Release 里实际变成
      # `_1.0.0-alpha.2_universal.dmg`（用户下载到的就是这么个看不出是什么的名字）。
      # 统一改成 ASCII 名再上传，名字也更好认。版本号从 package.json 取，避免解析中文前缀。
      - name: Normalize dmg name (ASCII-safe)
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/dmg
          ver=$(node -p "require('$GITHUB_WORKSPACE/package.json').version")
          for f in *.dmg; do
            cp "$f" "daoshengyi-${ver}-universal.dmg"
            rm -f "$f"
          done
          ls -l

      - name: Upload artifacts (universal dmg + app)
        uses: actions/upload-artifact@v7
        with:
          name: daoshengyi-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error

  # 推送 v* 标签时：发布 dmg 为 GitHub Release
  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create / Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find release -type f | head -n 20

          # ⚠️ 不能假设 dmg 就在 release/ 根目录下：upload-artifact 会保留 glob 的
          # **公共父目录**结构——上传的是 bundle/dmg/*.dmg + bundle/macos/*.app，
          # 公共父目录是 bundle/，所以产物里就是 dmg/ 与 macos/ 两个子目录。
          # 曾写死 `release/*.dmg` → gh 报 `no matches found for release/*.dmg`，
          # 发布 job 每次必失败（连兜底的 upload 也一起失败）。
          mapfile -t DMGS < <(find release -type f -name '*.dmg' | sort)
          if [ "${#DMGS[@]}" -eq 0 ]; then
            echo "::error::产物中没有 dmg 文件（见上方文件清单）"
            exit 1
          fi
          echo "待发布产物："
          printf '  %s\n' "${DMGS[@]}"

          # alpha/beta/rc 预发布标签 → 标记为 prerelease
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*) PRERELEASE="--prerelease" ;;
          esac

          # 不用 `create || upload` 串联：create 失败的原因不止「已存在」，
          # 那种写法会把真实错误掩盖成第二次失败，看不出根因。先判断再分支。
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release 已存在 → 覆盖上传产物"
            gh release upload "$GITHUB_REF_NAME" "${DMGS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${DMGS[@]}" \
              --generate-notes --repo "$GITHUB_REPOSITORY" $PRERELEASE
          fi
