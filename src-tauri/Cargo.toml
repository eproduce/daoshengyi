[package]
name = "daoshengyi"
version = "0.1.0"
description = "道生一 AI Agent 桌面客户端"
authors = ["you"]
edition = "2021"

[lib]
name = "daoshengyi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json", "cookies"], default-features = false }
tokio = { version = "1", features = ["sync", "macros", "process", "io-util", "io-std", "rt-multi-thread"] }
futures = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
libc = "0.2"
pdf-extract = "0.7"
encoding_rs = "0.8"
calamine = "0.26"
zip = "2"
snap = "1"
