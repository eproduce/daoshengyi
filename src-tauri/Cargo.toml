[package]
name = "daoshengyi"
version = "0.1.0"
description = "道生一 AI Agent 桌面客户端"
authors = ["you"]
edition = "2021"

[lib]
name = "daoshengyi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
