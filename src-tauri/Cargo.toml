[package]
name = "daoshengyi"
version = "1.0.0-alpha.1"
description = "道生一 AI Agent 桌面客户端"
authors = ["you"]
edition = "2021"

[lib]
name = "daoshengyi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json", "cookies"], default-features = false }
tokio = { version = "1", features = ["sync", "macros", "process", "io-util", "io-std", "rt-multi-thread", "time", "net"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
aes-gcm = "0.10"
aes = "0.8"
cbc = "0.1"
rand = "0.8"
base64 = "0.23"
hmac = "0.12"
sha2 = "0.10"
libc = "0.2"
portable-pty = "0.8"
pdf-extract = "0.7"
encoding_rs = "0.8"
calamine = "0.26"
zip = "2"
snap = "1"
