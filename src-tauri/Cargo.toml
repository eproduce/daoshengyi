[package]
name = "daoshengyi"
version = "1.0.0-alpha.8"
description = "道生一 AI Agent 桌面客户端"
authors = ["you"]
edition = "2021"

[lib]
name = "daoshengyi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：HUD 浮层的**透明窗口**在 macOS 上必须开这个（官方 config schema 明确要求
# `transparent` 配合它才生效，缺了就只是「看着设了透明、实际白底」）。
# 代价：走私有 API，提交 App Store 会被拒 —— 我们只走 GitHub Release 分发，可接受。
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
# 系统通知：任务完成 / 最终产物送达时通知用户（托盘进度三步中的第三步）
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json", "cookies"], default-features = false }
tokio = { version = "1", features = ["sync", "macros", "process", "io-util", "io-std", "rt-multi-thread", "time", "net"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
aes-gcm = "0.10"
aes = "0.8"
cbc = "0.1"
rand = "0.8"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
libc = "0.2"
portable-pty = "0.8"
pdf-extract = "0.7"
encoding_rs = "0.8"
calamine = "0.26"
zip = "2"
snap = "1"
# 图片解码/缩放：本地视觉模型输入前压缩（像素数直接决定本地推理耗时）
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# HUD spike：回读 NSWindow 真实状态（ignoresMouseEvents / isOpaque / level / styleMask …）。
# 这个 crate 本来就在依赖树里（tauri 的传递依赖），这里只是提为直接依赖 —— 因此**无需联网**
# 也能解析（本机 crates.io 不可达，新增陌生依赖必须先配稀疏镜像）。仅 macOS 编译。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
